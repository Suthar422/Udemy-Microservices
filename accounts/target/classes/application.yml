server:
  port: 8090
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  profiles:
    active: "qa"

build:
  version: "3.0"

accounts:
  message: "Welcome to My accounts related local APIs"
  contactDetails:
    name: "Local "
    email: "lk@bank.com"
  onCallSupport:
